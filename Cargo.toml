[package]
name = "cant"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "1.4.0"
ndarray = { version = "0.15.6", features = ["rayon"] }
rand = "0.8.5"
rand_distr = "0.4.3"
cant_cpu = { path = "crates/cant_cpu" }
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
mnist = { version = "0.5", features = ["download"] }

[target.'cfg(target_os = "macos")'.dependencies]
cant_metal = { path = "crates/cant_metal" }

[workspace]
members = [
    "crates/cant_cpu",
    "crates/cant_metal",
]

[profile.release]
debug = true
